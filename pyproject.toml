[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code2img"
version = "0.2.0"
description = "Transfer source files through a combined QR image"
readme = "project.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=11.3,<13",
    "pillow-heif>=1,<2",
    "zxing-cpp==3.0.0",
]

[project.scripts]
code2img = "code2img.__main__:main"

[tool.setuptools]
packages = ["code2img"]

[tool.setuptools.package-data]
code2img = ["receiver.html"]
